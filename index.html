<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Nhân Vật</title>
    <!-- Nhúng thư viện Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary-pink: #ffb6c1;
            --light-pink: #ffe6ea;
            --dark-pink: #d88fa0;
            --text-dark: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-pink);
            color: var(--text-dark);
        }

        header {
            background-color: var(--primary-pink);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        .btn-3d {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d63031;
            transition: all 0.1s ease;
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d63031;
        }

        .btn-secondary {
            background-color: #70a1ff;
            box-shadow: 0 4px 0 #1e90ff;
        }

        .btn-danger {
            background-color: #ff4757;
            box-shadow: 0 4px 0 #ff6b81;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h3 {
            color: #ff6b81;
            margin-bottom: 5px;
        }

        .tags {
            font-size: 0.8em;
            color: #747d8c;
            margin-top: 10px;
            font-style: italic;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 230, 234, 0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 30px 15px;
        }

        .modal-content {
            background: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: var(--dark-pink);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"], input[type="url"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--primary-pink);
            border-radius: 6px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        #detail-avatar {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: block;
            border: 5px solid var(--light-pink);
        }

        .detail-item {
            margin-bottom: 15px;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        /* VÙNG BÌNH LUẬN */
        .comments-section {
            margin-top: 30px;
            border-top: 2px solid var(--light-pink);
            padding-top: 20px;
        }

        .comment-box {
            background: #fff0f3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .reply-box {
            margin-left: 30px;
            border-left: 3px solid var(--primary-pink);
            padding-left: 10px;
        }

        .comment-author {
            font-weight: bold;
            color: #ff6b81;
            font-size: 14px;
        }

        .comment-time {
            font-size: 11px;
            color: #aaa;
            margin-left: 8px;
        }

        .reply-btn {
            background: none;
            border: none;
            color: #70a1ff;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Thế Giới Nhân Vật</h1>
        <button class="btn-3d" onclick="openCreateModal()">+ Tạo Character</button>
    </header>

    <main>
        <div class="character-grid" id="character-grid">
            <p style="text-align: center; width: 100%;">Đang tải nhân vật...</p>
        </div>
    </main>

    <!-- FORM TẠO / SỬA NHÂN VẬT -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCreateModal()">&times;</span>
            <h2 id="formTitle" style="color: #ff6b81; margin-bottom: 20px; text-align: center;">Tạo Nhân Vật Mới</h2>
            
            <form id="characterForm" onsubmit="submitCharacter(event)">
                <input type="hidden" id="editCharId">

                <div class="form-group">
                    <label>Tải ảnh Avatar <span id="imgRequireNote">(Bắt buộc) *</span></label>
                    <input type="file" id="avatarFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Tên nhân vật *</label>
                    <input type="text" id="charName" required>
                </div>
                <div class="form-group">
                    <label>Giới tính *</label>
                    <select id="charGender" required>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mật khẩu quản lý (để Sửa/Xóa sau này) *</label>
                    <input type="password" id="charPasskey" placeholder="Nhập mật khẩu tự chọn..." required>
                </div>
                <div class="form-group">
                    <label>Câu slogan *</label>
                    <input type="text" id="charSlogan" required>
                </div>
                <div class="form-group">
                    <label>Tên tác giả (Creator) *</label>
                    <input type="text" id="charAuthor" required>
                </div>
                <div class="form-group">
                    <label>Note creator (Tùy chọn)</label>
                    <input type="text" id="charNote">
                </div>
                <div class="form-group">
                    <label>Hashtag (VD: #school, #xuyên_không) *</label>
                    <input type="text" id="charTags" required>
                </div>
                <div class="form-group">
                    <label>Plot (Cốt truyện) *</label>
                    <textarea id="charPlot" required></textarea>
                </div>
                <div class="form-group">
                    <label>Giới thiệu (Introduce - Tùy chọn)</label>
                    <textarea id="charIntro"></textarea>
                </div>
                <div class="form-group">
                    <label>Đoạn mở đầu (Opening section - Tùy chọn)</label>
                    <textarea id="charOpening"></textarea>
                </div>
                <div class="form-group">
                    <label>Link (URL) *</label>
                    <input type="url" id="charLink" placeholder="https://" required>
                </div>

                <div style="text-align: center; margin-top: 25px;">
                    <button type="submit" class="btn-3d" id="submitBtn">Đăng Tải</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL XEM CHI TIẾT NHÂN VẬT -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetailModal()">&times;</span>
            <img id="detail-avatar" src="" alt="Avatar">
            <h2 id="detail-name" style="text-align: center; margin-bottom: 10px;"></h2>
            <div style="text-align: center; font-size: 13px; color: #888; margin-bottom: 20px;">
                👁️ <span id="detail-views">0</span> lượt xem | ❤️ <span id="detail-likes">0</span> lượt thích
            </div>
            
            <div class="detail-item"><strong>Giới tính:</strong> <span id="detail-gender"></span></div>
            <div class="detail-item"><strong>Tác giả:</strong> <span id="detail-author"></span></div>
            <div class="detail-item"><strong>Slogan:</strong> <em id="detail-slogan"></em></div>
            <div class="detail-item"><strong>Hashtag:</strong> <span id="detail-tags"></span></div>
            <div class="detail-item"><strong>Plot:</strong> <p id="detail-plot" style="white-space: pre-line; margin-top:5px;"></p></div>
            <div id="detail-intro-container" class="detail-item"><strong>Giới thiệu:</strong> <p id="detail-intro" style="white-space: pre-line; margin-top:5px;"></p></div>
            <div id="detail-opening-container" class="detail-item"><strong>Mở đầu:</strong> <p id="detail-opening" style="white-space: pre-line; margin-top:5px;"></p></div>
            <div id="detail-note-container" class="detail-item"><strong>Note:</strong> <span id="detail-note"></span></div>

            <!-- Nút Hành Động -->
            <div class="detail-actions">
                <button class="btn-3d" id="likeBtn" onclick="handleLike()">❤️ Thích</button>
                <button class="btn-3d btn-secondary" onclick="shareCharacter()">🔗 Chia sẻ</button>
                <button class="btn-3d" id="detail-link-btn" onclick="openCharacterLink()">Open Character</button>
                <button class="btn-3d btn-secondary" onclick="openEditModal()">✏️ Chỉnh sửa</button>
                <button class="btn-3d btn-danger" onclick="handleDelete()">🗑️ Xóa</button>
            </div>

            <!-- Khung Bình Luận -->
            <div class="comments-section">
                <h3>Bình Luận</h3>
                <div style="margin: 15px 0;">
                    <input type="text" id="commentAuthorInput" placeholder="Tên của bạn..." style="margin-bottom: 8px;">
                    <textarea id="commentTextInput" placeholder="Viết bình luận..."></textarea>
                    <button class="btn-3d" style="margin-top: 8px;" onclick="addComment(null)">Gửi bình luận</button>
                </div>
                <div id="commentsList"></div>
            </div>
        </div>
    </div>

    <script>
        // === KHAI BÁO SUPABASE ===
        const SUPABASE_URL = 'https://vkovlqgnucqhqbwzegxg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WFNR-2b2E2EB-1DzNAyRXg_kdaD4cOT';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentChar = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadCharacters();
            
            // Xử lý link chia sẻ trực tiếp (?id=xxx)
            const urlParams = new URLSearchParams(window.location.search);
            const charId = urlParams.get('id');
            if (charId) {
                const { data } = await supabaseClient.from('characters').select('*').eq('id', charId).single();
                if (data) showDetail(data);
            }
        });

        function openCreateModal() {
            document.getElementById('formTitle').innerText = "Tạo Nhân Vật Mới";
            document.getElementById('characterForm').reset();
            document.getElementById('editCharId').value = "";
            document.getElementById('avatarFile').required = true;
            document.getElementById('imgRequireNote').innerText = "(Bắt buộc) *";
            document.getElementById('createModal').style.display = 'block'; 
        }

        function closeCreateModal() { document.getElementById('createModal').style.display = 'none'; }
        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

        function openCharacterLink() {
            if(currentChar && currentChar.link) window.open(currentChar.link, '_blank');
        }

        // Tải danh sách Character
        async function loadCharacters() {
            const grid = document.getElementById('character-grid');
            const { data, error } = await supabaseClient.from('characters').select('*').order('created_at', { ascending: false });

            if (error || !data) {
                grid.innerHTML = '<p style="text-align: center; width: 100%;">Lỗi tải dữ liệu. Hãy kiểm tra Supabase.</p>';
                return;
            }

            if(data.length === 0) {
                grid.innerHTML = '<p style="text-align: center; width: 100%;">Chưa có nhân vật nào!</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showDetail(char);
                
                card.innerHTML = `
                    <img src="${char.avatar_url}" alt="${char.name}">
                    <div class="card-info">
                        <h3>${char.name}</h3>
                        <p style="font-size: 14px; font-weight: bold;">Creator: ${char.author}</p>
                        <p style="font-size: 14px; font-style: italic;">"${char.slogan}"</p>
                        <p class="tags">${char.hashtags}</p>
                        <div class="card-stats">
                            <span>👁️ ${char.views || 0}</span>
                            <span>❤️ ${char.likes || 0}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Mở Chi tiết + Tăng Lượt Xem
        async function showDetail(char) {
            currentChar = char;
            
            // Tăng Lượt Xem
            char.views = (char.views || 0) + 1;
            await supabaseClient.from('characters').update({ views: char.views }).eq('id', char.id);

            document.getElementById('detail-avatar').src = char.avatar_url;
            document.getElementById('detail-name').innerText = char.name;
            document.getElementById('detail-views').innerText = char.views;
            document.getElementById('detail-likes').innerText = char.likes || 0;
            document.getElementById('detail-gender').innerText = char.gender;
            document.getElementById('detail-author').innerText = char.author;
            document.getElementById('detail-slogan').innerText = `"${char.slogan}"`;
            document.getElementById('detail-tags').innerText = char.hashtags;
            document.getElementById('detail-plot').innerText = char.plot;
            
            const handleOptional = (id, data, containerId) => {
                if(data && data.trim() !== "") {
                    document.getElementById(id).innerText = data;
                    document.getElementById(containerId).style.display = "block";
                } else {
                    document.getElementById(containerId).style.display = "none";
                }
            }
            handleOptional('detail-intro', char.introduce, 'detail-intro-container');
            handleOptional('detail-opening', char.opening, 'detail-opening-container');
            handleOptional('detail-note', char.note, 'detail-note-container');

            document.getElementById('detailModal').style.display = 'block';
            loadComments(char.id);
        }

        // Tăng Lượt Thích (Like)
        async function handleLike() {
            if(!currentChar) return;
            currentChar.likes = (currentChar.likes || 0) + 1;
            document.getElementById('detail-likes').innerText = currentChar.likes;
            await supabaseClient.from('characters').update({ likes: currentChar.likes }).eq('id', currentChar.id);
            loadCharacters();
        }

        // Chia sẻ Link
        function shareCharacter() {
            if(!currentChar) return;
            const shareUrl = `${window.location.origin}${window.location.pathname}?id=${currentChar.id}`;
            navigator.clipboard.writeText(shareUrl);
            alert("Đã sao chép link chia sẻ nhân vật vào bộ nhớ tạm!");
        }

        // Xóa Nhân Vật (Cần Mật Khẩu)
        async function handleDelete() {
            if(!currentChar) return;
            const inputKey = prompt("Nhập mật khẩu quản lý nhân vật này để xóa:");
            if(!inputKey) return;

            if(inputKey === currentChar.passkey) {
                if(confirm("Bạn có chắc chắn muốn xóa nhân vật này?")) {
                    await supabaseClient.from('characters').delete().eq('id', currentChar.id);
                    alert("Đã xóa nhân vật thành công!");
                    closeDetailModal();
                    loadCharacters();
                }
            } else {
                alert("Mật khẩu không chính xác!");
            }
        }

        // Mở Form Sửa Nhân Vật
        function openEditModal() {
            if(!currentChar) return;
            const inputKey = prompt("Nhập mật khẩu quản lý để chỉnh sửa:");
            if(inputKey !== currentChar.passkey) {
                alert("Mật khẩu không chính xác!");
                return;
            }

            document.getElementById('formTitle').innerText = "Chỉnh Sửa Nhân Vật";
            document.getElementById('editCharId').value = currentChar.id;
            document.getElementById('charName').value = currentChar.name;
            document.getElementById('charGender').value = currentChar.gender;
            document.getElementById('charPasskey').value = currentChar.passkey;
            document.getElementById('charSlogan').value = currentChar.slogan;
            document.getElementById('charAuthor').value = currentChar.author;
            document.getElementById('charNote').value = currentChar.note || "";
            document.getElementById('charTags').value = currentChar.hashtags;
            document.getElementById('charPlot').value = currentChar.plot;
            document.getElementById('charIntro').value = currentChar.introduce || "";
            document.getElementById('charOpening').value = currentChar.opening || "";
            document.getElementById('charLink').value = currentChar.link;

            document.getElementById('avatarFile').required = false;
            document.getElementById('imgRequireNote').innerText = "(Để trống nếu giữ ảnh cũ)";

            closeDetailModal();
            document.getElementById('createModal').style.display = 'block';
        }

        // Đăng Tải / Cập Nhật Nhân Vật
        async function submitCharacter(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Đang xử lý...";
            btn.disabled = true;

            try {
                const editId = document.getElementById('editCharId').value;
                let avatarUrl = currentChar ? currentChar.avatar_url : "";

                // Kiểm tra có tải ảnh mới lên không
                const fileInput = document.getElementById('avatarFile');
                if(fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(fileName, file);
                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                    avatarUrl = publicUrlData.publicUrl;
                }

                const charData = {
                    avatar_url: avatarUrl,
                    name: document.getElementById('charName').value,
                    gender: document.getElementById('charGender').value,
                    passkey: document.getElementById('charPasskey').value,
                    slogan: document.getElementById('charSlogan').value,
                    author: document.getElementById('charAuthor').value,
                    note: document.getElementById('charNote').value,
                    hashtags: document.getElementById('charTags').value,
                    plot: document.getElementById('charPlot').value,
                    introduce: document.getElementById('charIntro').value,
                    opening: document.getElementById('charOpening').value,
                    link: document.getElementById('charLink').value
                };

                if (editId) {
                    // Cập nhật nhân vật cũ
                    await supabaseClient.from('characters').update(charData).eq('id', editId);
                    alert("Cập nhật nhân vật thành công!");
                } else {
                    // Tạo mới nhân vật
                    await supabaseClient.from('characters').insert([charData]);
                    alert("Tạo nhân vật thành công!");
                }

                document.getElementById('characterForm').reset();
                closeCreateModal();
                loadCharacters();

            } catch (error) {
                console.error(error);
                alert("Có lỗi xảy ra: " + error.message);
            } finally {
                btn.innerText = "Đăng Tải";
                btn.disabled = false;
            }
        }

        // === QUẢN LÝ BÌNH LUẬN & REPLY ===
        async function loadComments(charId) {
            const container = document.getElementById('commentsList');
            const { data } = await supabaseClient.from('comments').select('*').eq('character_id', charId).order('created_at', { ascending: true });

            if(!data || data.length === 0) {
                container.innerHTML = '<p style="color:#aaa; font-size:13px;">Chưa có bình luận nào.</p>';
                return;
            }

            // Phân loại bình luận gốc và reply
            const mainComments = data.filter(c => !c.parent_id);
            const replies = data.filter(c => c.parent_id);

            container.innerHTML = '';
            mainComments.forEach(c => {
                const commentEl = document.createElement('div');
                commentEl.className = 'comment-box';
                commentEl.innerHTML = `
                    <span class="comment-author">${c.author_name}</span>
                    <span class="comment-time">${new Date(c.created_at).toLocaleDateString('vi-VN')}</span>
                    <p style="margin-top:5px; font-size:14px;">${c.content}</p>
                    <button class="reply-btn" onclick="showReplyForm('${c.id}')">↩ Tra lời</button>
                    <div id="replyForm-${c.id}"></div>
                    <div id="repliesContainer-${c.id}"></div>
                `;
                container.appendChild(commentEl);

                // Vẽ các reply con
                const childReplies = replies.filter(r => r.parent_id === c.id);
                const replyContainer = commentEl.querySelector(`#repliesContainer-${c.id}`);
                childReplies.forEach(r => {
                    const replyEl = document.createElement('div');
                    replyEl.className = 'comment-box reply-box';
                    replyEl.innerHTML = `
                        <span class="comment-author">${r.author_name}</span>
                        <span class="comment-time">${new Date(r.created_at).toLocaleDateString('vi-VN')}</span>
                        <p style="margin-top:5px; font-size:14px;">${r.content}</p>
                    `;
                    replyContainer.appendChild(replyEl);
                });
            });
        }

        function showReplyForm(commentId) {
            const formContainer = document.getElementById(`replyForm-${commentId}`);
            formContainer.innerHTML = `
                <div style="margin-top: 10px;">
                    <input type="text" id="replyAuthor-${commentId}" placeholder="Tên bạn..." style="margin-bottom: 5px;">
                    <textarea id="replyText-${commentId}" placeholder="Trả lời..."></textarea>
                    <button class="btn-3d" style="font-size:12px; padding:5px 10px;" onclick="addComment('${commentId}')">Gửi trả lời</button>
                </div>
            `;
        }

        async function addComment(parentId) {
            if(!currentChar) return;

            let author = "", text = "";
            if (parentId) {
                author = document.getElementById(`replyAuthor-${parentId}`).value;
                text = document.getElementById(`replyText-${parentId}`).value;
            } else {
                author = document.getElementById('commentAuthorInput').value;
                text = document.getElementById('commentTextInput').value;
            }

            if(!author.trim() || !text.trim()) {
                alert("Vui lòng nhập tên và nội dung bình luận!");
                return;
            }

            await supabaseClient.from('comments').insert([{
                character_id: currentChar.id,
                parent_id: parentId,
                author_name: author,
                content: text
            }]);

            if(!parentId) {
                document.getElementById('commentAuthorInput').value = "";
                document.getElementById('commentTextInput').value = "";
            }

            loadComments(currentChar.id);
        }
    </script>
</body>
</html>
